<section class="modal">
  <button class="close-button" (click)="cancel()">×</button>
  <h3 class="modal-title">Сменить пароль</h3>

  <div class="field">
    <p class="field__label">Текущий пароль</p>
    <input type="password" [formField]="passwordForm.currentPassword" class="field__input">
  </div>
  <div class="field">
    <p class="field__label">Новый пароль</p>
    <input type="password" [formField]="passwordForm.newPassword" class="field__input">
  </div>
  <div class="field">
    <p class="field__label">Подтвердите новый пароль</p>
    <input type="password" [formField]="passwordForm.confirmNewPassword" class="field__input">
  </div>

  <span class="notification" [style.color]="colorNotification()">{{ notification() }}</span>

  <button class="submit-button" (click)="submit()">Сменить пароль</button>
</section>
